<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/sidebar.css">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

<div class="contenedor">

    <div class="menu">

        <h2>Sistema SVA</h2>

        <a href="./dashboard.html">Dashboard</a>
        <a href="./clientes.html">Clientes</a>
        <a href="./operaciones.html" class="activo">Operaciones</a>
        <a href="./alertas.html">Alertas</a>
        <a href="./reportes.html">Reportes</a>

        <br>

        <a href="#" id="btnSalir">Cerrar sesión</a>

    </div>

    <div class="contenido">

        <h1>Operaciones</h1>

        <p id="usuarioTexto">Usuario:</p>

        <hr>

        <h2>Resumen de operaciones</h2>

        <div class="row mb-4">

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5>Total de operaciones</h5>
                        <p id="totalOperaciones">0</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5>Monto total</h5>
                        <p id="montoTotal">$0</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5>Clientes registrados</h5>
                        <p id="clientesRegistrados">0</p>
                    </div>
                </div>
            </div>

        </div>

        <h3>Operaciones recientes</h3>

        <table id="operationsTable" class="table table-bordered table-striped">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Tipo</th>
                    <th>Monto</th>
                    <th>Fecha</th>
                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>

<script type="module" src="./js/views/operaciones.js"></script>

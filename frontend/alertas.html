<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Alertas - Sistema SVA</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/clientes.css">
    <link rel="stylesheet" href="css/alertas.css">
</head>
<body class="app-body">

    <div class="app-container">
        
        <aside class="sidebar">
            <h2 class="sidebar-brand">Sistema SVA</h2>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="clientes.html" class="nav-item">Clientes</a>
                <a href="operaciones.html" class="nav-item">Operaciones</a>
                <a href="alertas.html" class="nav-item active">Alertas</a>
                <a href="reportes.html" class="nav-item">Reportes</a>
            </nav>
            <button id="btn-logout" class="nav-item logout-btn">Cerrar sesión</button>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <h1>Monitoreo de Alertas PLD</h1>
                <p class="user-info">Oficial: <span id="nombre-usuario">Cargando...</span></p>
            </header>

            <div class="cards-container mb-20" style="margin-top: 20px;">
                <div class="summary-card" style="border-left: 5px solid #ef4444;">
                    <h3>Nuevas</h3>
                    <p class="card-number" id="card-nuevas" style="color: #ef4444 !important;">0</p>
                </div>
                <div class="summary-card" style="border-left: 5px solid #f59e0b;">
                    <h3>En Proceso</h3>
                    <p class="card-number" id="card-investigando" style="color: #f59e0b !important;">0</p>
                </div>
                <div class="summary-card" style="border-left: 5px solid #10b981;">
                    <h3>Cerradas</h3>
                    <p class="card-number" id="card-cerradas" style="color: #10b981 !important;">0</p>
                </div>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Folio</th>
                            <th>Cliente</th>
                            <th>Motivo de Alerta</th>
                            <th>Detectada</th>
                            <th>Estatus</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-alertas-body">
                        <tr><td colspan="6" style="text-align: center;">Cargando motor de reglas...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modal-alerta" class="modal-overlay">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2>Gestión de Alerta <span id="modal-folio"></span></h2>
                <button id="btn-cerrar-modal" class="btn-close">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 15px; color: #555;">
                    Estás gestionando la alerta del cliente: <br>
                    <strong id="modal-cliente-nombre" style="font-size: 18px; color: #333;"></strong>
                </p>
                
                <div class="form-group">
                    <label for="select-nuevo-estatus">Dictamen Técnico:</label>
                    <select id="select-nuevo-estatus" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 15px;">
                        <option value="Nueva">No Atendida (Nueva)</option>
                        <option value="Investigando">En Investigación (Abierta)</option>
                        <option value="Falsa Alarma">Falsa Alarma (Cerrar)</option>
                        <option value="Reportada a CNBV">Reportada a CNBV (Cerrar y Escalar)</option>
                    </select>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button id="btn-guardar-estatus" class="btn-primary" style="margin-bottom: 0;">Guardar Cambios</button>
                    <button id="btn-generar-xml" class="btn-primary" style="background-color: #d97706; margin-bottom: 0; border: none;">Generar XML CNBV</button>
                    <button id="btn-ver-perfil" class="btn-ver" style="background-color: #6c757d; width: 100%;">Ir a Clientes</button>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button id="btn-guardar-estatus" class="btn-primary" style="margin-bottom: 0;">Guardar Cambios</button>
                    <button id="btn-ver-perfil" class="btn-ver" style="background-color: #6c757d; width: 100%;">Ir a Clientes</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/views/alertas.js"></script>
</body>
</html>

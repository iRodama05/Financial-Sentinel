<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SVA - Carga Masiva de Datos</title>
    <link rel="stylesheet" href="css/estilos.css"> <style>
        .container { padding: 30px; max-width: 800px; margin: 0 auto; }
        .drop-zone {
            border: 2px dashed #0d6efd;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            transition: background 0.3s;
        }
        .drop-zone--over { background: #e9ecef; border-color: #0a58ca; }
        .drop-zone p { margin: 0; font-size: 16px; color: #495057; }
        .btn-cargar {
            background: #0d6efd; color: white; border: none; padding: 10px 20px;
            border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px;
        }
        .btn-cargar:disabled { background: #6c757d; cursor: not-allowed; }
        .alerta { padding: 15px; border-radius: 4px; margin-top: 20px; display: none; }
        .alerta-exito { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .alerta-error { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Ingesta Masiva de Clientes</h2>
        <p>Carga de archivos en formato CSV para la actualización de la base de datos de cumplimiento.</p>
        
        <div id="vista-bloqueada" class="alerta alerta-error" style="display: none;">
            <strong>Acceso Denegado:</strong> Tu perfil actual es de Solo Lectura (Visor). No tienes permisos para realizar cargas masivas.
        </div>

        <div id="seccion-carga">
            <form id="form-carga-masiva">
                <div class="drop-zone" id="drop-zone-csv">
                    <p>Arrastra tu archivo .csv aquí o <span style="text-decoration: underline; color: #0d6efd;">haz clic para buscar</span></p>
                    <input type="file" id="input-file-csv" accept=".csv" style="display: none;">
                </div>
                <div id="archivo-seleccionado" style="margin-top: 10px; font-weight: bold; color: #212529;"></div>
                <button type="submit" class="btn-cargar" id="btn-enviar-csv" disabled>Iniciar Ingesta Masiva</button>
            </form>
            <div id="panel-feedback" class="alerta"></div>
        </div>
    </div>

    <script type="module" src="js/views/cargaMasiva.js"></script>
</body>
</html>

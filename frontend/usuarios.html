<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Sistema SVA</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/modulos.css">
</head>
<body class="app-body">
    <div class="app-container">
        
        <aside class="sidebar">
            <h2 class="sidebar-brand">Sistema SVA</h2>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="clientes.html" class="nav-item">Clientes</a>
                <a href="operaciones.html" class="nav-item">Operaciones</a>
                <a href="alertas.html" class="nav-item">Alertas</a>
                <a href="reportes.html" class="nav-item">Reportes</a>
                <a href="carga-masiva.html" class="nav-item" id="menu-csv" style="display: none;">Carga Masiva CSV</a>
                <a href="usuarios.html" class="nav-item active" id="menu-usuarios" style="display: none;">Gestión Usuarios</a>
            </nav>
            <button id="btn-logout" class="nav-item logout-btn">Cerrar sesión</button>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <h2>Gestión de Accesos e Identidades</h2>
            </header>

            <div class="modulo-container">
                <div id="bloqueo-admin" class="alerta alerta-error">
                    <strong>Acceso Restringido:</strong> Esta sección requiere privilegios de Administrador.
                </div>

                <div id="seccion-formulario-usuarios">
                    <form id="form-alta-usuario">
                        <div class="form-group">
                            <label>Nombre Completo:</label>
                            <input type="text" id="txt-nombre" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Correo Electrónico:</label>
                            <input type="email" id="txt-correo" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Contraseña Temporal:</label>
                            <input type="password" id="txt-password" class="form-control" minlength="6" required>
                        </div>
                        <div class="form-group">
                            <label>Rol en el Sistema:</label>
                            <select id="select-rol" class="form-control" required>
                                <option value="" disabled selected>-- Seleccione nivel --</option>
                                <option value="admin">Administrador</option>
                                <option value="oficial">Oficial de Cumplimiento</option>
                                <option value="visor">Visor de Auditoría</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-primary" id="btn-crear-usuario">Dar de Alta Usuario</button>
                    </form>
                    <div id="usuario-feedback" class="alerta"></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/views/usuarios.js"></script>
    <script src="js/components/sidebar.js"></script>
</body>
</html>

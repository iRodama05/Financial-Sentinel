<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SVA - Panel de Control de Identidades</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .container { padding: 30px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-control { width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; }
        .btn-guardar {
            background: #198754; color: white; border: none; padding: 10px 15px;
            border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%;
        }
        .btn-guardar:disabled { background: #6c757d; }
        .alerta { padding: 12px; border-radius: 4px; margin-top: 15px; display: none; font-size: 14px; }
        .alerta-exito { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .alerta-error { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gestión de Accesos e Identidades</h2>
        <p>Añadir nuevos operadores, oficiales de cumplimiento o administradores al sistema transaccional.</p>

        <div id="bloqueo-admin" class="alerta alerta-error" style="display: none;">
            <strong>Acceso Restringido:</strong> Esta sección requiere privilegios de Administrador de Sistema. Su intento de acceso ha sido registrado para auditoría.
        </div>

        <div id="seccion-formulario-usuarios">
            <form id="form-alta-usuario">
                <div class="form-group">
                    <label for="txt-nombre">Nombre Completo:</label>
                    <input type="text" id="txt-nombre" class="form-control" placeholder="Ej. Lic. Alejandro Garza" required>
                </div>
                <div class="form-group">
                    <label for="txt-correo">Correo Electrónico Institucional:</label>
                    <input type="email" id="txt-correo" class="form-control" placeholder="usuario@fsst.com" required>
                </div>
                <div class="form-group">
                    <label for="txt-password">Contraseña Temporal:</label>
                    <input type="password" id="txt-password" class="form-control" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="select-rol">Rol Asignado en el Sistema:</label>
                    <select id="select-rol" class="form-control" required>
                        <option value="" disabled selected>-- Seleccione un nivel de acceso --</option>
                        <option value="admin">Administrador (Acceso Total)</option>
                        <option value="oficial">Oficial de Cumplimiento (Gestión y Dictamen)</option>
                        <option value="visor">Visor de Auditoría (Solo Lectura)</option>
                    </select>
                </div>
                <button type="submit" class="btn-guardar" id="btn-crear-usuario">Dar de Alta Usuario</button>
            </form>
            <div id="usuario-feedback" class="alerta"></div>
        </div>
    </div>

    <script type="module" src="js/views/usuarios.js"></script>
</body>
</html>

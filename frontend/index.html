<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema SVA - Inicio de Sesión</title>
    <link rel="stylesheet" href="css/layout.css">
</head>
<body class="login-body">

    <div class="login-container">
        <form id="form-login" class="login-card">
            
            <h1>Sistema SVA</h1>
            <p class="subtitle">Inicio de sesión</p>

            <div class="form-group">
                <label for="correo">Correo</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="********" required>
            </div>

            <div id="mensaje-error" class="error-message" style="display: none;"></div>

            <button type="submit" class="btn-primary">Entrar</button>

            <a href="#" class="link-secondary">Denuncia anónima</a>

            <hr class="divider">

            <div class="test-users">
                <p class="test-title">Usuarios de prueba</p>
                <p><strong>oficial@fsst.com</strong> / admin123</p>
                <p><strong>viewer@fsst.com</strong> / viewer123</p>
            </div>

        </form>
    </div>

    <script type="module" src="js/views/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denuncia Anónima - Sistema SVA</title>

    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/clientes.css">
    <link rel="stylesheet" href="css/denuncia.css">
</head>
<body class="app-body">

    <div class="app-container">

        <aside class="sidebar">
            <h2 class="sidebar-brand">Sistema SVA</h2>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="clientes.html" class="nav-item">Clientes</a>
                <a href="operaciones.html" class="nav-item">Operaciones</a>
                <a href="alertas.html" class="nav-item">Alertas</a>
                <a href="reportes.html" class="nav-item">Reportes</a>
                <a href="denuncia-anonima.html" class="nav-item active">Denuncia Anónima</a>
                <a href="carga-masiva.html" class="nav-item" id="menu-csv" style="display: none;">Carga Masiva CSV</a>
                <a href="usuarios.html" class="nav-item" id="menu-usuarios" style="display: none;">Gestión Usuarios</a>
            </nav>
            <button id="btn-logout" class="nav-item logout-btn">Cerrar sesión</button>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <h1>Denuncia Anónima</h1>
                <p class="user-info">Usuario: <span id="nombre-usuario">Cargando...</span></p>
            </header>

            <hr class="divider">

            <h2 class="section-title">Registro de denuncia</h2>
            <p style="color: #666; margin-bottom: 20px;">
                Completa la información correspondiente para registrar una denuncia anónima.
            </p>

            <div class="table-container">
                <div class="denuncia-form">

                    <div class="form-group">
                        <label for="tipo-denuncia">Tipo de denuncia</label>
                        <select id="tipo-denuncia" class="filter-input">
                            <option value="">Seleccione</option>
                            <option value="Lavado de dinero">Lavado de dinero</option>
                            <option value="Fraude">Fraude</option>
                            <option value="Corrupción">Corrupción</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="asunto">Asunto</label>
                        <input type="text" id="asunto" class="filter-input" placeholder="Ingrese el asunto">
                    </div>

                    <div class="form-group">
                        <label for="involucrado">Involucrado</label>
                        <input type="text" id="involucrado" class="filter-input" placeholder="Nombre de la persona involucrada">
                    </div>

                    <div class="form-group">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" class="filter-input">
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" class="filter-input" placeholder="Describe la situación"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="evidencia">Adjuntar evidencia</label>
                        <input type="file" id="evidencia" class="filter-input">
                    </div>

                    <button id="btn-enviar-denuncia" class="btn-ver">
                        Enviar denuncia
                    </button>

                    <p id="mensaje-denuncia" style="margin-top: 15px; font-weight: bold;"></p>

                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/views/denunciaAnonima.js"></script>
    <script src="/js/components/sidebar.js"></script>
</body>
</html>

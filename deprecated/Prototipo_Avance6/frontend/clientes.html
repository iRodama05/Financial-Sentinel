<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/sidebar.css">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

<div class="contenedor">

    <div class="menu">

        <h2>Sistema SVA</h2>

        <a href="./dashboard.html">Dashboard</a>
        <a href="./clientes.html" class="activo">Clientes</a>
        <a href="./operaciones.html">Operaciones</a>
        <a href="./alertas.html">Alertas</a>
        <a href="./reportes.html">Reportes</a>

        <br>

        <a href="#" id="btnSalir">Cerrar sesión</a>

    </div>

    <div class="contenido">

        <h1>Clientes</h1>

        <p id="usuarioTexto">Usuario:</p>

        <hr>

        <h2>Lista de Clientes</h2>

        <div class="row mb-4">

            <div class="col-md-4">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h5>Total de clientes</h5>

                        <p id="totalClientes">0</p>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h5>Activos</h5>

                        <p id="clientesActivos">0</p>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h5>Bajo revisión</h5>

                        <p id="clientesRevision">0</p>

                    </div>

                </div>

            </div>

        </div>

        <div class="mb-3">

            <input type="text" id="clientSearch" class="form-control" placeholder="Buscar cliente">

        </div>

        <div class="mb-3">

            <select id="statusFilter" class="form-select">

                <option value="Todos">Todos los estados</option>
                <option value="Activo">Activo</option>
                <option value="Revisión">Bajo revisión</option>

            </select>

        </div>

        <table id="clientsTable" class="table table-bordered table-striped">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>RFC</th>
                    <th>Correo</th>
                    <th>PEP</th>
                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>

<script type="module" src="./js/views/clientes.js"></script>

</body>
</html>

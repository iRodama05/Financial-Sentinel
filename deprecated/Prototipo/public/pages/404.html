<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — FSST</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
      color: #fff; text-align: center;
    }
    .big { font-size: 8rem; font-weight: 700; opacity: 0.15; line-height: 1; }
    h2  { font-size: 1.75rem; font-weight: 700; margin: 1rem 0 0.5rem; }
    p   { color: #93c5fd; margin-bottom: 2rem; }
    a   {
      display: inline-block; padding: 0.75rem 2rem;
      background: linear-gradient(90deg, #2563eb, #1d4ed8);
      color: #fff; border-radius: 0.5rem; text-decoration: none;
      font-weight: 500; box-shadow: 0 4px 12px rgba(37,99,235,0.4);
    }
    a:hover { background: linear-gradient(90deg, #1d4ed8, #1e40af); }
  </style>
</head>
<body>
  <div>
    <div class="big">404</div>
    <h2>Página no encontrada</h2>
    <p>La página que buscas no existe o no tienes acceso.</p>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Denuncia Enviada — FSST</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .box {
      background: #fff; border-radius: 1rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      padding: 3rem 2.5rem; max-width: 440px; width: 100%; text-align: center;
    }
    .icon-circle {
      width: 5rem; height: 5rem;
      background: #dcfce7; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;
    }
    .icon-circle svg { width: 3rem; height: 3rem; color: #16a34a; }
    h2 { font-size: 1.75rem; font-weight: 700; color: #0f172a; margin-bottom: 0.75rem; }
    p  { color: #475569; line-height: 1.6; margin-bottom: 0.5rem; }
    .small { color: #94a3b8; font-size: 0.875rem; margin-top: 0.5rem; }
    .btn {
      display: inline-block; margin-top: 2rem;
      padding: 0.75rem 2rem;
      background: linear-gradient(90deg, #2563eb, #1d4ed8);
      color: #fff; border-radius: 0.5rem; text-decoration: none;
      font-weight: 500; font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
      transition: all 0.2s;
    }
    .btn:hover { background: linear-gradient(90deg, #1d4ed8, #1e40af); }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon-circle">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>
    <h2>Denuncia enviada</h2>
    <p>Su denuncia ha sido registrada de forma anónima y será revisada por nuestro equipo de cumplimiento.</p>
    <p class="small">No se ha almacenado ningún dato personal relacionado con esta denuncia.</p>
    <a href="/" class="btn">Volver al inicio</a>
  </div>
</body>
</html>
